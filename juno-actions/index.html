<style>
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #DCE7D5; color: #12150E; }

<body>
<main>
  <span class="pill">Solana devnet</span>
  <h1>Juno Blinks</h1>
  <p>Every post on Juno is its own market. These Solana Actions let anyone buy into a post, or boost it with dSKR, from any Blink client.</p>
  <p><code>/api/actions/buy?mint=&lt;coin&gt;</code><br /><code>/api/actions/boost?post=&lt;coin&gt;</code></p>
  <p>Source: github.com/nickthelegend/juno-clockin (juno-actions/)</p>
</main>
